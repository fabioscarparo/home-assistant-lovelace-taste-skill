name: Release zip

# Attaches ha-lovelace-taste.zip to every published release,
# ready to upload in the Skills section of the Claude apps.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the skill zip
        run: |
          cd skills
          zip -r ../ha-lovelace-taste.zip ha-lovelace-taste -x '*.DS_Store'

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ha-lovelace-taste.zip --clobber
